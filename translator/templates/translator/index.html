<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 750px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .languages {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language-box {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .translate-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .translate-btn:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5ff;
            border-radius: 12px;
        }

        .result h2 {
            margin-top: 0;
            color: #444;
        }

        .result p {
            font-size: 17px;
            color: #333;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .languages {
                flex-direction: column;
                gap: 10px;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌍 Translator App</h1>
    <p class="subtitle">Translate text between different languages</p>

    <form method="POST">
        {% csrf_token %}

        <label for="{{ form.text.id_for_label }}">
            {{ form.text.label }}
        </label>

        {{ form.text }}

        <div class="languages">

            <div class="language-box">
                <label for="{{ form.source_language.id_for_label }}">
                    From
                </label>
                {{ form.source_language }}
            </div>

            <div class="language-box">
                <label for="{{ form.target_language.id_for_label }}">
                    To
                </label>
                {{ form.target_language }}
            </div>

        </div>

        <button type="submit" class="translate-btn">
            Translate
        </button>
    </form>

    {% if translated_text %}
    <div class="result">
        <h2>Translation</h2>
        <p>{{ translated_text }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
